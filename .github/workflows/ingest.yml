name: Ingest

# Keeps the current season up to date in Postgres from ESPN. Needs the DATABASE_URL secret.
# stats.nba.com blocks GitHub's runners, so career history (`history`) and NBA.com-only data
# (`daily`, `weekly` for awards) are run from a home machine; see the README. With an
# NBA_API_PROXY secret they can run here by hand too. BALLDONTLIE_API_KEY is an optional fallback.

on:
  schedule:
    - cron: "*/15 0-6,23 * * *" # live: scores every 15 min during game hours (7pm-3am ET)
    - cron: "5 * * * *"         # hourly: news and scores
    - cron: "30 10 * * *"       # nightly: ESPN schedule, box scores, season totals, standings, Ledger
  workflow_dispatch:
    inputs:
      command:
        description: "bk_ingest command (nightly, live, hourly, migrate, or a single task)"
        required: true
        default: nightly
      args:
        description: "Extra arguments, e.g. --season 2025-26"
        required: false
        default: ""

concurrency:
  group: ingest-${{ github.event.schedule || inputs.command }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pick command
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          case "$SCHEDULE" in
            "*/15 0-6,23 * * *") cmd=live ;;
            "5 * * * *")         cmd=hourly ;;
            "30 10 * * *")       cmd=nightly ;;
            *)                   cmd="$INPUT_COMMAND" ;;
          esac
          echo "command=$cmd" >> "$GITHUB_OUTPUT"
      - name: Migrate
        run: python -m bk_ingest migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run ${{ steps.pick.outputs.command }}
        run: python -m bk_ingest "$COMMAND" $ARGS
        env:
          COMMAND: ${{ steps.pick.outputs.command }}
          ARGS: ${{ inputs.args }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NBA_API_PROXY: ${{ secrets.NBA_API_PROXY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
